[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="1c-process-mining"
version="0.1.0"
requires-python=">=3.12"
description="Анализ журналов событий: варианты, ожидания, возвраты и кандидаты на автоматизацию."
dependencies=["fastapi>=0.115,<0.116", "pydantic>=2,<3", "uvicorn>=0.30,<0.35"]

[project.optional-dependencies]
graphs=["networkx>=3.0"]
dev=["pytest>=8,<9", "httpx>=0.27,<0.29"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
addopts="-q"
